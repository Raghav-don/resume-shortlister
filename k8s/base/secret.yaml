apiVersion: v1
kind: Secret
metadata:
  name: resume-shortlister-secrets
  namespace: resume-shortlister
type: Opaque
stringData:
  # Database credentials (replace with actual values or use SealedSecrets/External Secrets)
  DATABASE_URL: "jdbc:postgresql://postgres:5432/resume_shortlister"
  DATABASE_USER: "postgres"
  DATABASE_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # JWT Secret (generate with: openssl rand -base64 64)
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION_GENERATE_WITH_OPENSSL_RAND_BASE64_64"
  JWT_EXPIRATION_MS: "86400000"

  # Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""

  # CORS
  CORS_ALLOWED_ORIGINS: "https://app.resume-shortlister.example.com"