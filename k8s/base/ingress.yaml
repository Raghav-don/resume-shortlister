apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resume-shortlister-ingress
  namespace: resume-shortlister
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.resume-shortlister.example.com
        - app.resume-shortlister.example.com
      secretName: resume-shortlister-tls
  rules:
    - host: api.resume-shortlister.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: resume-shortlister-backend
                port:
                  number: 8080
    - host: app.resume-shortlister.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: resume-shortlister-frontend
                port:
                  number: 80