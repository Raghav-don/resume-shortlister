apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: resume-shortlister-staging

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: resume-shortlister-backend
      spec:
        replicas: 2
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: resume-shortlister-frontend
      spec:
        replicas: 2

images:
  - name: ghcr.io/your-org/resume-shortlister-backend
    newTag: staging
  - name: ghcr.io/your-org/resume-shortlister-frontend
    newTag: staging

configMapGenerator:
  - name: resume-shortlister-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=staging
      - LOGGING_LEVEL_COM_RESUME_SHORTLISTER=INFO