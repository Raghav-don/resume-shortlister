apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: resume-shortlister-dev

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: resume-shortlister-backend
      spec:
        replicas: 1
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: resume-shortlister-frontend
      spec:
        replicas: 1

images:
  - name: ghcr.io/your-org/resume-shortlister-backend
    newTag: dev
  - name: ghcr.io/your-org/resume-shortlister-frontend
    newTag: dev

configMapGenerator:
  - name: resume-shortlister-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=dev
      - LOGGING_LEVEL_COM_RESUME_SHORTLISTER=DEBUG
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY=DEBUG